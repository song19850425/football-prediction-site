<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史数据浏览 · 足球预测系统</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  .filterbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin: 8px 0 22px;
  }
  .filterbar label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
  .filterbar .fld { display: flex; flex-direction: column; }
  select, input[type="search"] {
    background: var(--bg-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 13.5px; outline: none; min-width: 130px;
  }
  select:focus, input[type="search"]:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); color: var(--muted); transition: .16s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip.on { background: var(--accent); color: #04140a; border-color: var(--accent); font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .kpi b { display: block; font-size: 22px; letter-spacing: -.5px; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .trend { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .chart-card h4 { margin: 0 0 4px; font-size: 14px; letter-spacing: -.2px; }
  .chart-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .chart-card svg { width: 100%; height: auto; display: block; overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  @media (max-width: 900px) { .trend { grid-template-columns: 1fr; } }
  .tablewrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; background: rgba(11,18,32,.96); backdrop-filter: blur(8px);
    text-align: left; padding: 12px 14px; font-size: 12px; letter-spacing: .5px;
    color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,.05); white-space: nowrap; }
  tbody tr:hover { background: var(--card-hover); }
  .lg { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .score { font-weight: 700; letter-spacing: 1px; }
  .res { font-weight: 700; padding: 1px 8px; border-radius: 6px; font-size: 12px; }
  .res.H { color: #22c55e; background: rgba(34,197,94,.12); }
  .res.D { color: #f59e0b; background: rgba(245,158,11,.12); }
  .res.A { color: #38bdf8; background: rgba(56,189,248,.12); }
  .odds { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pager { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 18px 0 8px; flex-wrap: wrap; }
  .pager button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13.5px;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager .info { font-size: 13px; color: var(--muted); }
  .loading { text-align: center; padding: 80px 0; color: var(--muted); }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">📚</span>
      <span><span data-i18n="history.brand">历史数据浏览</span><small data-i18n="history.brandSub">Historical Match Data</small></span>
    </div>
    <nav class="topnav">
      <a href="index.html" data-i18n="nav.overview">总览</a>
      <a href="viewer.html" data-i18n="nav.viewer">全页面查看器</a>
      <a class="active" href="history.html" data-i18n="nav.history">历史数据</a>
      <a href="weekly.html" data-i18n="nav.weekly">未来一周预测</a>
      <select class="langsel" id="langsel" aria-label="Language"></select>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero" style="padding:44px 0 8px">
    <span class="eyebrow" data-i18n="history.eyebrow">● 五大联赛 · 10 个赛季</span>
    <h1 data-i18n="history.h1">历史比赛数据浏览</h1>
    <p class="lead" data-i18n="history.lead">汇总英超、西甲、意甲、德甲、法甲 2016/17–2025/26 共 10 个赛季的完整比赛结果与欧赔（B365）。支持按联赛、赛季、球队、赛果筛选，并实时统计胜平负分布、场均进球与大小球比例。</p>
    <div class="stats">
      <div class="stat"><b id="k-matches">—</b><span data-i18n="history.stat.matches">历史比赛</span></div>
      <div class="stat"><b id="k-seasons">—</b><span data-i18n="history.stat.seasons">赛季</span></div>
      <div class="stat"><b>5</b><span data-i18n="history.stat.leagues">联赛</span></div>
      <div class="stat"><b id="k-odds">—</b><span data-i18n="history.stat.odds">含欧赔场次</span></div>
    </div>
  </section>

  <div id="loading" class="loading"><div class="spinner"></div><span data-i18n="history.loading">正在加载历史数据…</span></div>

  <div id="app" style="display:none">
    <div class="filterbar">
      <div class="fld">
        <label data-i18n="filter.league">联赛</label>
        <div class="chips" id="f-league"></div>
      </div>
      <div class="fld">
        <label data-i18n="filter.season">赛季</label>
        <select id="f-season"></select>
      </div>
      <div class="fld">
        <label data-i18n="filter.result">赛果</label>
        <select id="f-result">
          <option value="" data-i18n="filter.all">全部</option>
          <option value="H" data-i18n="res.H">主胜</option>
          <option value="D" data-i18n="res.D">平局</option>
          <option value="A" data-i18n="res.A">客胜</option>
        </select>
      </div>
      <div class="fld">
        <label data-i18n="filter.team">球队（主/客队名）</label>
        <select id="f-team">
          <option value="" data-i18n="filter.allTeams">全部球队</option>
        </select>
      </div>
      <div class="fld">
        <label data-i18n="filter.order">排序</label>
        <select id="f-order">
          <option value="desc" data-i18n="order.desc">日期（新→旧）</option>
          <option value="asc" data-i18n="order.asc">日期（旧→新）</option>
        </select>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>
    <div class="trend" id="trend"></div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="th.date">日期</th>
            <th data-i18n="th.league">联赛</th>
            <th data-i18n="th.home">主队</th>
            <th data-i18n="th.score">比分</th>
            <th data-i18n="th.away">客队</th>
            <th data-i18n="th.result">结果</th>
            <th class="hide-sm" data-i18n="th.odds">欧赔 主/平/客</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pager">
      <button id="p-first" data-i18n="page.first">« 首页</button>
      <button id="p-prev" data-i18n="page.prev">上一页</button>
      <span class="info" id="p-info"></span>
      <button id="p-next" data-i18n="page.next">下一页</button>
      <button id="p-last" data-i18n="page.last">末页 »</button>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span data-i18n="history.footer1">数据来源：football-data.co.uk（公开数据集）· 仅供机器学习与数据研究展示</span>
    <span id="counter-slot"></span>
  </div>
</footer>

<script src="assets/counter.js"></script>
<script src="assets/i18n.js"></script>
<script>
const PAGE_SIZE = 50;
let DATA = null;
let filtered = [];
let page = 1;
const state = { league: "", season: "", result: "", team: "", order: "desc" };

function T(k, vars) { return I18N.fmt(I18N.t(k), vars); }
function lgName(n) { const m = I18N.leagues[I18N.current()] || {}; return m[n] || n; }

function fmtDate(iso) { return iso.replace(/-/g, '/'); }
function pct(n, d) { return d ? (n / d * 100).toFixed(1) + '%' : '—'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* 球队下拉：与左侧联赛联动，仅列出当前联赛下出现过的球队 */
function rebuildTeamSelect() {
  const sel = document.getElementById('f-team');
  if (!sel) return;
  const set = new Set();
  for (const m of DATA.matches) {
    if (state.league && m.l !== state.league) continue;
    set.add(m.h); set.add(m.a);
  }
  const teams = [...set].sort((a, b) => a.localeCompare(b, 'zh'));
  sel.innerHTML = '<option value="">' + I18N.t('filter.allTeams') + '</option>' +
    teams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if (state.team && teams.includes(state.team)) sel.value = state.team;
  else { sel.value = ''; state.team = ''; }
}

function applyFilter() {
  filtered = DATA.matches.filter(m =>
    (!state.league || m.l === state.league) &&
    (!state.season || m.s === state.season) &&
    (!state.result || m.r === state.result) &&
    (!state.team || m.h === state.team || m.a === state.team)
  );
  if (state.order === "asc") filtered = filtered.slice().reverse();
  page = 1;
  renderKpis();
  renderTrend();
  renderTable();
}

/* ===== 走势可视化：按赛季聚合，受联赛 / 球队 / 赛果筛选影响（不受赛季筛选影响） ===== */
function seasonSeries() {
  const map = new Map();
  for (const m of DATA.matches) {
    if (state.league && m.l !== state.league) continue;
    if (state.team && m.h !== state.team && m.a !== state.team) continue;
    if (state.result && m.r !== state.result) continue;
    let s = map.get(m.s);
    if (!s) { s = { n: 0, g: 0, over: 0, h: 0, d: 0, a: 0 }; map.set(m.s, s); }
    s.n++; const gg = m.hg + m.ag; s.g += gg; if (gg > 2.5) s.over++;
    if (m.r === "H") s.h++; else if (m.r === "D") s.d++; else s.a++;
  }
  return DATA.seasons.map(sn => {
    const s = map.get(sn);
    if (!s || !s.n) return { season: sn, n: 0, avg: null, over: null, h: null, d: null, a: null };
    return { season: sn, n: s.n, avg: s.g / s.n, over: s.over / s.n * 100, h: s.h / s.n * 100, d: s.d / s.n * 100, a: s.a / s.n * 100 };
  });
}

function lineChartSVG(opt) {
  const W = 660, H = 240, pL = 40, pR = 42, pT = 14, pB = 28;
  const n = opt.labels.length;
  const xs = i => pL + (n <= 1 ? 0 : i / (n - 1) * (W - pL - pR));
  const lv = opt.lines.filter(l => l.axis === "L").flatMap(l => l.vals).filter(v => v != null);
  const rv = opt.lines.filter(l => l.axis === "R").flatMap(l => l.vals).filter(v => v != null);
  const lMax = lv.length ? Math.max(...lv) * 1.15 : 1;
  const rMax = rv.length ? Math.min(100, Math.max(...rv) * 1.15) : 100;
  const ys = (v, axis) => pT + (1 - v / (axis === "L" ? lMax : rMax)) * (H - pT - pB);
  const path = (vals, axis) => {
    let d = "", started = false;
    vals.forEach((v, i) => {
      if (v == null) { started = false; return; }
      d += (started ? "L" : "M") + xs(i).toFixed(1) + " " + ys(v, axis).toFixed(1) + " ";
      started = true;
    });
    return d.trim();
  };
  let grid = "";
  for (let k = 0; k <= 4; k++) {
    const y = pT + k / 4 * (H - pT - pB);
    const lVal = (lMax * (4 - k) / 4), rVal = (rMax * (4 - k) / 4);
    grid += `<line x1="${pL}" y1="${y.toFixed(1)}" x2="${W - pR}" y2="${y.toFixed(1)}" stroke="rgba(148,163,184,.14)"/>`;
    grid += `<text x="${pL - 7}" y="${(y + 3.5).toFixed(1)}" fill="#64748b" font-size="10" text-anchor="end">${lVal.toFixed(1)}</text>`;
    grid += `<text x="${W - pR + 7}" y="${(y + 3.5).toFixed(1)}" fill="#64748b" font-size="10" text-anchor="start">${rVal.toFixed(0)}%</text>`;
  }
  let xlab = "";
  opt.labels.forEach((lb, i) => {
    xlab += `<text x="${xs(i).toFixed(1)}" y="${H - 8}" fill="#64748b" font-size="10" text-anchor="middle">${esc(lb.slice(-5))}</text>`;
  });
  let body = "";
  opt.lines.forEach(l => {
    body += `<path d="${path(l.vals, l.axis)}" fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    l.vals.forEach((v, i) => {
      if (v == null) return;
      body += `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v, l.axis).toFixed(1)}" r="2.8" fill="#0b1220" stroke="${l.color}" stroke-width="2"><title>${l.name} · ${esc(opt.labels[i])}: ${v.toFixed(2)}</title></circle>`;
    });
  });
  const legend = opt.lines.map(l => `<span><i style="background:${l.color}"></i>${l.name}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || I18N.t("chart.aria"))}">${grid}${xlab}${body}</svg><div class="legend">${legend}</div>`;
}

function renderTrend() {
  const el = document.getElementById("trend");
  if (!el) return;
  const s = seasonSeries();
  const labels = s.map(x => x.season);
  const hasData = s.some(x => x.n > 0);
  if (!hasData) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="chart-card">
      <h4>${I18N.t("chart1.title")}</h4>
      <div class="sub">${I18N.t("chart1.sub")}</div>
      ${lineChartSVG({ aria: I18N.t("chart1.aria"), labels, lines: [
        { name: I18N.t("legend.avgGoals"), color: "#22c55e", axis: "L", vals: s.map(x => x.avg) },
        { name: I18N.t("legend.over25pct"), color: "#38bdf8", axis: "R", vals: s.map(x => x.over) }
      ] })}
    </div>
    <div class="chart-card">
      <h4>${I18N.t("chart2.title")}</h4>
      <div class="sub">${I18N.t("chart2.sub")}</div>
      ${lineChartSVG({ aria: I18N.t("chart2.aria"), labels, lines: [
        { name: I18N.t("legend.hPct"), color: "#22c55e", axis: "R", vals: s.map(x => x.h) },
        { name: I18N.t("legend.dPct"), color: "#f59e0b", axis: "R", vals: s.map(x => x.d) },
        { name: I18N.t("legend.aPct"), color: "#38bdf8", axis: "R", vals: s.map(x => x.a) }
      ] })}
    </div>`;
}

function renderKpis() {
  const n = filtered.length;
  let h = 0, d = 0, a = 0, goals = 0, over25 = 0, btts = 0, withOdds = 0;
  for (const m of filtered) {
    if (m.r === 'H') h++; else if (m.r === 'D') d++; else if (m.r === 'A') a++;
    const g = m.hg + m.ag;
    goals += g;
    if (g > 2.5) over25++;
    if (m.hg > 0 && m.ag > 0) btts++;
    if (m.oh && m.od && m.oa) withOdds++;
  }
  const cards = [
    [I18N.t('kpi.filtered'), n.toLocaleString()],
    [I18N.t('kpi.wdl'), `${pct(h, n)} / ${pct(d, n)} / ${pct(a, n)}`],
    [I18N.t('kpi.avgGoals'), n ? (goals / n).toFixed(2) : '—'],
    [I18N.t('kpi.over25'), pct(over25, n)],
    [I18N.t('kpi.btts'), pct(btts, n)],
    [I18N.t('kpi.withOdds'), withOdds.toLocaleString()]
  ];
  document.getElementById('kpis').innerHTML = cards.map(c =>
    `<div class="kpi"><b>${c[1]}</b><span>${c[0]}</span></div>`).join('');
}

function renderTable() {
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > pages) page = pages;
  const start = (page - 1) * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  document.getElementById('tbody').innerHTML = slice.map(m => `
    <tr>
      <td class="odds">${fmtDate(m.d)}</td>
      <td><span class="lg">${lgName(DATA.leagues[m.l] || m.l)}</span></td>
      <td>${m.h}</td>
      <td class="score">${m.hg} - ${m.ag}</td>
      <td>${m.a}</td>
      <td><span class="res ${m.r}">${m.r === 'H' ? I18N.t('res.H') : m.r === 'D' ? I18N.t('res.Dshort') : I18N.t('res.A')}</span></td>
      <td class="odds hide-sm">${m.oh || '—'} / ${m.od || '—'} / ${m.oa || '—'}</td>
    </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:40px">${I18N.t('table.empty')}</td></tr>`;
  document.getElementById('p-info').textContent =
    total ? T('page.infoFmt', { p: page, n: pages, t: total.toLocaleString() }) : I18N.t('page.noData');
  document.getElementById('p-first').disabled = page <= 1;
  document.getElementById('p-prev').disabled = page <= 1;
  document.getElementById('p-next').disabled = page >= pages;
  document.getElementById('p-last').disabled = page >= pages;
}

function buildLeagueChips() {
  const lg = document.getElementById('f-league');
  const opts = [{ k: '', t: I18N.t('filter.all') }].concat(Object.entries(DATA.leagues).map(([k, v]) => ({ k, t: lgName(v) })));
  lg.innerHTML = opts.map(o => `<span class="chip${o.k === state.league ? ' on' : ''}" data-k="${o.k}">${o.t}</span>`).join('');
  lg.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    lg.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    state.league = c.dataset.k;
    rebuildTeamSelect();
    applyFilter();
  }));
}

function buildSeasonSelect() {
  const ss = document.getElementById('f-season');
  ss.innerHTML = '<option value="">' + I18N.t('filter.allSeasons') + '</option>' +
    DATA.seasons.slice().reverse().map(s => `<option value="${s}">${s}</option>`).join('');
  if (state.season) ss.value = state.season;
}

function initControls() {
  buildLeagueChips();
  buildSeasonSelect();

  document.getElementById('f-season').addEventListener('change', e => { state.season = e.target.value; applyFilter(); });
  document.getElementById('f-result').addEventListener('change', e => { state.result = e.target.value; applyFilter(); });
  document.getElementById('f-order').addEventListener('change', e => { state.order = e.target.value; applyFilter(); });
  document.getElementById('f-team').addEventListener('change', e => { state.team = e.target.value; applyFilter(); });

  document.getElementById('p-first').onclick = () => { page = 1; renderTable(); scrollTop(); };
  document.getElementById('p-prev').onclick = () => { page--; renderTable(); scrollTop(); };
  document.getElementById('p-next').onclick = () => { page++; renderTable(); scrollTop(); };
  document.getElementById('p-last').onclick = () => { page = Math.ceil(filtered.length / PAGE_SIZE); renderTable(); scrollTop(); };
}
function scrollTop() { window.scrollTo({ top: 300, behavior: 'smooth' }); }

fetch('data/history.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('k-matches').textContent = d.count.toLocaleString();
    document.getElementById('k-seasons').textContent = d.seasons.length;
    const withOdds = d.matches.filter(m => m.oh && m.od && m.oa).length;
    document.getElementById('k-odds').textContent = withOdds.toLocaleString();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initControls();
    rebuildTeamSelect();
    applyFilter();
  })
  .catch(err => {
    document.getElementById('loading').innerHTML = I18N.t('history.loadFail') + err.message;
  });

/* 语言切换：重渲染受语言影响的动态区块（保留当前筛选与分页） */
document.addEventListener('i18n:change', () => {
  if (!DATA) return;
  buildLeagueChips();
  buildSeasonSelect();
  rebuildTeamSelect();
  renderKpis();
  renderTrend();
  renderTable();
});
</script>
</body>
</html>
