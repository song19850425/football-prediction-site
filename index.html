<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>足球预测系统 · 在线总览</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">⚽</span>
      <span><span data-i18n="brand.name">足球预测系统</span><small data-i18n="brand.subtitle">Football Prediction Suite</small></span>
    </div>
    <nav class="topnav">

      <a href="viewer.html" data-i18n="nav.viewer">全页面查看器</a>
      <a href="weekly.html" data-i18n="nav.weekly">未来一周预测</a>

      <select class="langsel" id="langsel" aria-label="Language"></select>
    </nav>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow" data-i18n="index.eyebrow">● 在线部署 · 单页入口</span>
    <h1 data-i18n="index.h1">一个链接，看遍整套足球预测系统的所有页面</h1>

    <div class="hero-actions">
      <a class="btn primary" href="weekly.html" data-i18n="index.btn.weekly">未来一周预测 →</a>
      <a class="btn ghost" href="viewer.html" data-i18n="index.btn.viewer">进入全页面查看器</a>
      <a class="btn ghost" href="history.html" data-i18n="index.btn.history">历史数据浏览</a>
      <a class="btn ghost" href="dashboards/prediction-dashboard-deploy/index.html" target="_blank" rel="noopener" data-i18n="index.btn.dashboard">打开实时看板</a>
    </div>

    <div class="stats" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat"><b id="s-pages">—</b><span data-i18n="index.stat.pages">在线页面</span></div>
      <div class="stat"><b>3</b><span data-i18n="index.stat.apps">交互应用 / 看板</span></div>

      <div class="stat"><b>17,937</b><span data-i18n="index.stat.matches">历史比赛数据</span></div>
      <div class="stat"><b id="s-visits" data-counter="short">—</b><span data-i18n="index.stat.visits">本站访问次数</span></div>
    </div>
  </section>

  <div id="portal-root"></div>
</main>

<footer>
  <div class="wrap">
    <span data-i18n="index.footer1">足球预测系统 · 所有页面均为静态部署，无需登录即可查看。</span>
    <span id="counter-slot"></span>
    <span data-i18n="index.footer2">仅供机器学习与数据研究展示 · 不构成任何投注建议</span>
  </div>
</footer>

<script src="assets/counter.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
  renderPortal();
  document.getElementById("s-pages").textContent = countAll();
</script>
